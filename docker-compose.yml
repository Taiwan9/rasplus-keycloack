version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-rasplus
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: RASPLUS
      MYSQL_USER: rasmoo
      MYSQL_PASSWORD: senha123
    volumes:
      - mysql_data_container:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - keycloak_network

  redis:
    image: redis:4
    container_name: redis-rasplus-1
    ports:
      - "6379:6379"
    volumes:
      - redis_data_container:/data
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:20.0.2
    container_name: keycloak-rasplus
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/KEYCLOAK
      KC_DB_USERNAME: rasmoo
      KC_DB_PASSWORD: senha123
    command: start-dev
    depends_on:
      - mysql
    volumes:
      - keycloak_data_container:/opt/keycloak/data
    networks:
      - keycloak_network

networks:
  keycloak_network:
    driver: bridge

volumes:
  mysql_data_container:
  redis_data_container:
  keycloak_data_container:
